services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: naa_lms
      POSTGRES_USER: naa_lms
      POSTGRES_PASSWORD: naa_lms
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naa_lms"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://naa_lms:naa_lms@db:5432/naa_lms
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      FRONTEND_URL: http://localhost:3000
      # Email/SECRET_KEY etc. fall back to the placeholder defaults baked
      # into settings.py; override here (or with an env_file: ./backend/.env)
      # for anything beyond local use.
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_APP_NAME: National Audit Academy
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_APP_NAME: National Audit Academy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  media:
